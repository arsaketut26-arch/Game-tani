function fishTick(dt){

  else if(fs==2){ft-=dt;bob.position.y=-.62+Math.sin(ck.elapsedTime*30)*.05;if(ft<=0){cancelFish();toast('Ikannya lepas...')}}
  else if(fs==3){
    const m=fg,h=hold||keys.e||keys.f||keys[' ']||keys.enter||lid>=0,hz=m.s/2;
    m.v+=(h?3.0:-2.3)*dt;m.v=Math.max(-1.2,Math.min(1.2,m.v));m.z+=m.v*dt;
    if(m.z<hz){m.z=hz;m.v=Math.abs(m.v)*.3}
    if(m.z>1-hz){m.z=1-hz;m.v=0}
    m.w-=dt;
    if(m.w<=0){
      m.t=m.tier>=2?R():Math.max(.1,Math.min(.9,m.f+(R()-.5)*(m.tier==1?.65:.45)));
      m.w=m.tier==3?(.18+R()*.38):(m.tier==2?(.35+R()*.65):(m.tier==1?(.7+R()*.9):(1+R()*1.2)));
    }
    m.f+=(m.t-m.f)*Math.min(1,dt*m.spd);
    const ok=Math.abs(m.f-m.z)<hz;
    m.p+=(ok?m.gain:-m.lose)*dt;
    bob.position.y=-.55+(ok?0:Math.sin(ck.elapsedTime*22)*.05);
    $('fz').style.cssText=`bottom:${(m.z-hz)*100}%;height:${m.s*100}%`;

function tn(f,v,d,ty,to,dl=0){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+dl;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(to);o.start(t);o.stop(t+d+.05)}
const sfx=(f,d=.15,ty='sine',v=.18,dl=0)=>AC&&tn(f,v,d,ty,AC.destination,dl);
const TRACKS=[
 {ch:[[48,55,59,64],[45,52,55,64],[41,48,52,57],[43,50,55,64]],d:[7,6,5,6]},
 {ch:[[50,57,61,66],[48,55,59,64],[46,53,57,62],[43,50,55,64]],d:[8,6,7,6]},
 {ch:[[45,52,57,64],[43,50,55,62],[41,48,55,60],[48,55,59,64]],d:[6,7,6,8]},
 {ch:[[43,50,54,62],[45,52,57,64],[47,54,59,66],[50,57,61,64]],d:[7,6,6,7]}
];
let bgTrack=0,bgSwitch=0,bgStep=0;
function beat(){
  if(!mus||!AC)return;
  const now=performance.now();
  if(!bgSwitch)bgSwitch=now;
  if(now-bgSwitch>=180000){bgTrack=(bgTrack+1)%TRACKS.length;bgSwitch=now;bgStep=0;toast('🎵 Backsound berganti...')}
  const t=TRACKS[bgTrack],c=t.ch[(bgStep>>2)%t.ch.length];
  if(bgStep%8===0)c.slice(0,3).forEach((m,i)=>tn(fr(m-12),.045,t.d[i]||6,'sine',bus));
  if(bgStep%4===0)tn(fr(c[3]+12),.05,1.2,'triangle',bus);
  if(R()<.5)tn(fr(c[R()*4|0]+24),.03,1.6,'sine',bus);
  bgStep++;
}
function audio(){AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=R()*2-1;
 const s=AC.createBufferSource(),f=AC.createBiquadFilter();s.buffer=b;s.loop=true;f.type='bandpass';f.frequency.value=3000;f.Q.value=.35;rainG=AC.createGain();rainG.gain.value=0;s.connect(f);f.connect(rainG);rainG.connect(AC.destination);s.start();
 bus=AC.createGain();bus.gain.value=.6;const lo=AC.createBiquadFilter(),dl=AC.createDelay(1),fb=AC.createGain();lo.frequency.value=2000;dl.delayTime.value=.45;fb.gain.value=.38;
 bus.connect(lo);lo.connect(AC.destination);lo.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(AC.destination);bgSwitch=performance.now();setInterval(beat,520);rainSet()}
function rainSet(){if(AC)rainG.gain.setTargetAtTime(S.rain?.3:0,AC.currentTime,1.5)}

let weeklyOrders=[],lastOrderWeek=-1;
function ensureOrders(){
  const wk=Math.floor((S.d-1)/7);
  if(wk===lastOrderWeek)return;
  lastOrderWeek=wk;
  const days=[0,1,2,3,4,5,6].sort(()=>R()-.5).slice(0,3);
  const pool=[...ORD_POOL].sort(()=>R()-.5);
  weeklyOrders=days.map((off,i)=>{
    const o=pool[i],day=wk*7+1+off;
    const due=o.kind==='crop'?CR[o.item][4]+1:(o.days||3);
    return {...o,day,deadline:day+due,status:'available'};
  });
}
function todaysOrder(){
  ensureOrders();
  return weeklyOrders.find(o=>o.day===S.d&&o.status==='available');
}
function orderItem(o){return o.kind==='crop'?CR[o.item]:FI[o.item]}
function orderIcon(o){return o.kind==='crop'?CR[o.item][1]:(o.item>=8?'👑':'🐟')}
function orderBoard(){
  const o=todaysOrder();
  if(!o){
    pop('<h3>📋 Papan Pesanan</h3><p>Belum ada pesanan baru. Mampir lagi nanti!</p><button class=ac onclick=hide()>Tutup</button>');
    return;
  }
  const c=orderItem(o),ic=orderIcon(o);
  const have=o.kind==='crop'?S.cr[o.item]:S.fh[o.item];
  const ready=have>=o.qty;
  pop(`<h3>📋 Papan Pesanan</h3>
    <p>Warga desa membutuhkan bantuanmu. Pilih pesanan, siapkan hasil panen atau ikanmu, lalu antar kepada pemesan sebelum batas waktu.</p>
    <div class=stbox><b>Pesanan ${o.npc}</b><br>“Aku membutuhkan ${o.qty} ${c[0].toLowerCase()} segar. Bisakah kamu membantuku?”<br>Permintaan: ${ic} ${c[0]} ×${o.qty}<br>Batas pengiriman: Hari ${o.deadline}<br>Imbalan: ${o.coins} koin dan kedekatan dengan ${o.npc}<br><small>${ready?'Siap diantar':'Menunggu pengiriman'}</small></div>
    ${ready?`<button class=ac onclick=submitOrder()>Serahkan Pesanan</button>`:`<button class=ac onclick=acceptOrder()>Terima Pesanan</button>`}

function acceptOrder(){

function submitOrder(){
  const o=weeklyOrders.find(x=>x.status==='accepted'&&S.d<=x.deadline&&(x.kind==='crop'?S.cr[x.item]:S.fh[x.item])>=x.qty);

function buyFood(i,isCityShop=0){
  const m=KD_MENU[i];
  if(S.m<m[2]){toast('Uang tidak cukup!');sfx(180,.15,'square');return}
  S.m-=m[2];
  S.food[i]++;
  if(S.food[S.foodSel]<=0)S.foodSel=i;
  sfx(980,.15,'triangle');
  toast(`${m[1]} ${m[0]} dibeli dan disimpan di menu tangan.`);
  hb();
  kopShop(isCityShop);
}
function nextOwned(arr,sel){
  for(let k=1;k<=arr.length;k++){const i=(sel+k)%arr.length;if(arr[i]>0)return i}
  return sel;
}
function cycleFood(){S.foodSel=nextOwned(S.food,S.foodSel);hb()}
function useFood(){
  if(S.food[S.foodSel]<=0){S.foodSel=nextOwned(S.food,S.foodSel);hb();return}
  const m=KD_MENU[S.foodSel];
  S.food[S.foodSel]--;
  S.hg=Math.min(100,S.hg+m[3]);
  S.th=Math.min(100,S.th+m[4]);
  if(S.hg>30&&S.th>30)S.hp=Math.min(100,S.hp+8);
  sfx(980,.15,'triangle');
  toast(`Menikmati ${m[1]} ${m[0]}! Segar & bertenaga!`);
  hb();
}

    bp.z-=spd*dt;

const FR=n=>S.fr[n.ix]||(S.fr[n.ix]=[0,0,0,0,0]),HR=n=>Math.min(10,FR(n)[0]/250|0),pf=(n,id)=>{const h=((n.ix*31+id*17+7)*2654435761>>>0)%12;return h<1?2:h<4?1:h==4?-1:0};
function talk(n,m){

  const chap=Math.min(n.L.length-1,h<3?0:h<7?1:2);
  m=m||n.L[chap];gl=sl=m;
  pop(`<h3>${n.n}</h3>
    <div class=tag>${n.role||'Warga Desa'} · ${n.fam||'Keluarga Lembah Damai'}</div>
    <div>${'❤️'.repeat(h)+'🤍'.repeat(10-h)}</div>
    <div class=stbox><b>📖 Kisah:</b> ${n.story||'Warga ramah yang mencintai ketenangan Lembah Damai.'}</div>
    <p>“${m}”</p>
    <button class=ac onclick=chat(${n.ix})>💬 Ngobrol (${f[1]}/2 hari ini)</button>
    <button onclick=gifts(${n.ix})>🎁 Beri hadiah${f[2]?' (sudah hari ini)':''}</button>`+
    (n.kopdes?'<button class=ac onclick=kopShop(0)>🛒 Belanja Makanan & Minuman</button>':'')+
    (n.smith?'<button class=ac onclick=smith()>⚒️ Bengkel Upgrade Peralatan</button>':n.shop?'<button class=ac onclick=shop()>🛒 Belanja Bibit & Jual Hasil</button>':'')+
    (n.lurah?'<button onclick=buyH()>🏠 Beli Rumah ('+HPR.toLocaleString('id-ID')+'🪙)</button>':'')+
    '<button onclick=hide()>Tutup</button>');
}
function chat(i){
  const n=NP[i],f=FR(n);
  if(f[1]>=2){talk(n,'Aku sudah banyak bercerita hari ini. Lanjut ngobrol lagi besok ya!');return}
  f[1]++;f[0]=Math.min(2500,f[0]+(f[1]==1?20:15));
  let dailyGift='';
  if(f[1]===1&&!f[4]){f[4]=1;f[0]=Math.min(2500,f[0]+10);dailyGift='<br><b>❤️ Kedekatanmu dengan '+n.n+' bertambah.</b>';sfx(1000,.15)}
  const h=HR(n);
  const chap=Math.min(n.L.length-1,h<3?0:h<7?1:2);
  let m=(R()<.65?n.L[chap]:PK(TG[h<3?0:h<6?1:h<8?2:3]))+dailyGift;
  if(h>=8&&!f[3]){
    f[3]=1;const r=R();let g;
    if(r<.4){const c=150+(R()*250|0);S.m+=c;g=c+'🪙'}
    else if(r<.75){const o=Math.min(5,h-8+(R()*3|0)),q=1+(R()*2|0);S.ore[o]+=q;g=q+' '+OR[o][1]+' '+OR[o][0]}
    else{const c=R()*5|0;S.seeds[c]+=3;g='3 bibit '+CR[c][0]}
    m+='<br><b>🎁 '+n.n+' memberimu hadiah persahabatan: '+g+'!</b>';sfx(1000,.2);

function move(dt,T){
  if(sit){
    if(false){standUp();jmp=0}
    else{
      pg.position.copy(P);
      pg.up.position.y=.55;pg.tr.rotation.x=.35;
      pg.l.forEach((l)=>{l.rotation.x=-1.35;l.k.rotation.x=1.5});
      pg.a.forEach(a=>{a.rotation.x=-.55;a.e.rotation.x=-.35});
      poseTool(T);return;
    }
  }
  let ix=jx+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=jy+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
  if(an||fs==3)ix=iy=0;
  const l=Math.hypot(ix,iy),cr=crch||keys.c||keys.control;
  const isRun=!cr&&(spr||keys.shift)&&l>.1&&S.hg>3&&S.th>3;

  const drainMult=isRun?3.6:(l>.1?1.15:0.65);
  S.hg=Math.max(0,S.hg-dt*0.24*drainMult);
  S.th=Math.max(0,S.th-dt*0.32*drainMult);
  if(S.hg<=0||S.th<=0){
    S.hp-=dt*1.2;
    if(S.hp<=0){hurt(1);return}
  }

  const gh0=H(P.x,P.z),air0=P.y>gh0+.14;
  let tvx=0,tvz=0;
  if(l>.1){
    const k=Math.min(1,l)/l,sx=Math.sin(cy),cz=Math.cos(cy);ix*=k;iy*=k;
    const dx=ix*cz-iy*sx,dz=-ix*sx-iy*cz,spd=cr?2.6:(isRun?9.4:5.6);
    tvx=dx*spd;tvz=dz*spd;fa=Math.atan2(dx,dz);if(fs)cancelFish();
  }
  const kk=1-Math.exp(-(l>.1?(air0?5:(isRun?9:12)):(air0?1.5:15))*dt);
  vX+=(tvx-vX)*kk;vZ+=(tvz-vZ)*kk;
  if(!tvx&&Math.abs(vX)<.02)vX=0;if(!tvz&&Math.abs(vZ)<.02)vZ=0;
  {const nx=P.x+vX*dt,nz=P.z+vZ*dt;
   if(inK||inCl||inLb||inHm||inCity||H(nx,nz)>-.5){P.x=nx;P.z=nz}else if(H(nx,P.z)>-.5){P.x=nx;vZ=0}else if(H(P.x,nz)>-.5){P.z=nz;vX=0}else{vX=vZ=0}}

  if(inK){
    P.x=Math.max(KD.x-KD.w/2+.7,Math.min(KD.x+KD.w/2-.7,P.x));
    P.z=Math.max(KD.z-KD.d/2+.7,Math.min(KD.z+KD.d/2-.7,P.z));
    if(!window.dmInside&&Math.abs(P.x-KD.x)<3.1&&P.z<KD.z-2.3)P.z=KD.z-2.3;
  }else if(inCl){
    P.x=Math.max(CK.x-CK.w/2+.7,Math.min(CK.x+CK.w/2-.7,P.x));

  }else if(inC){
    const dx2=P.x-CV.x,dz2=P.z-CV.z,d=Math.hypot(dx2,dz2);if(d>CV.r-4){P.x=CV.x+dx2/d*(CV.r-4);P.z=CV.z+dz2/d*(CV.r-4)}
  }else{

  {

    const base=inK?KD:inCl?CK:inLb?LB:inHm?HM:null;

        if(ox>0&&oz>0){if(ox<oz)P.x+=dx2<0?-ox:ox;else P.z+=dz2<0?-oz:oz}
      });
    }
  }

  const gh=H(P.x,P.z);
  coy=(P.y<=gh+.05&&vy<=0)?.12:Math.max(0,coy-dt);jb=jmp?.14:Math.max(0,jb-dt);jmp=0;
  if(jb>0&&coy>0){vy=8.8;jb=0;coy=0}

  walk(pg,Math.hypot(vX,vZ)>.4,T,cr?7:(isRun?16:11),cr,{run:isRun,air:wasAir,vy,land});poseTool(T);
}

function npcs(dt,T){
  const ng=isNight();
  NP_IN.forEach(n=>{
    const show=(n.clinic&&inCl&&!ng)||(n.lib&&inLb&&!ng);
    n.g.visible=!!show;
    if(show){n.g.position.set(n.x,0,n.z);walk(n.g,0,T,6)}
  });

  const pushCol=(p)=>{
    for(let i=0;i<col2.length;i++){
      const c=col2[i];
      if(c.w<1.1)continue;
      const dx2=p.x-c.x,dz2=p.z-c.z,ox=c.w/2+.45-Math.abs(dx2),oz=c.d/2+.45-Math.abs(dz2);
      if(ox>0&&oz>0){if(ox<oz)p.x+=dx2<0?-ox:ox;else p.z+=dz2<0?-oz:oz}
    }
  };
  NP.forEach(n=>{
    const g=n.g,p=g.position;
    if(n.kopdes){
      g.visible=inK&&!ng;
      if(g.visible){p.set(n.x,0,n.z);g.rotation.y=0;walk(g,0,T,6)}
      return;
    }
    if(inC||inK||inCl||inLb||inHm||inCity){g.visible=false;return}
    if(ng){
      if(n.atHome){g.visible=false;return}
      const hm=n.home;
      const dx=hm.dx-p.x,dz=hm.dz-p.z,d=Math.hypot(dx,dz);
      if(d>.45){
        g.visible=Math.hypot(p.x-P.x,p.z-P.z)<95;
        const s=(n.kid?2.7:2.2)*dt;p.x+=dx/d*s;p.z+=dz/d*s;g.rotation.y=Math.atan2(dx,dz);
        pushCol(p);p.y=H(p.x,p.z);walk(g,1,T+n.x,n.kid?12:8);
      }else{
        n.atHome=1;g.visible=false;
      }
      return;
    }
    if(n.atHome){
      n.atHome=0;p.set(n.home.dx,H(n.home.dx,n.home.dz),n.home.dz);
      n.tx=n.hx;n.tz=n.hz;
    }
    const dx=n.tx-p.x,dz=n.tz-p.z,d=Math.hypot(dx,dz);let m=0;
    if(!(g.visible=Math.hypot(p.x-P.x,p.z-P.z)<85))return;
    if(!n.shop){
      if(d>.2){const s=(n.kid?2.1:1.3)*dt;p.x+=dx/d*s;p.z+=dz/d*s;g.rotation.y=Math.atan2(dx,dz);pushCol(p);m=1}
      else if((n.w-=dt)<0){
        n.w=(n.kid?1.2:2.2)+R()*4;
        const rW=n.kid?9:5.5;
        n.tx=n.hx+(R()-.5)*rW;n.tz=n.hz+(R()-.5)*rW;
        const blocked=col2.some(c=>c.w>=1.1&&Math.abs(n.tx-c.x)<c.w/2+.8&&Math.abs(n.tz-c.z)<c.d/2+.8);
        if(H(n.tx,n.tz)<-.3||blocked){n.tx=n.hx;n.tz=n.hz}
      }
    }else{
      if(d>.2){const s=1.8*dt;p.x+=dx/d*s;p.z+=dz/d*s;g.rotation.y=Math.atan2(dx,dz);pushCol(p);m=1}
      else g.rotation.y=0;
    }
    p.y=H(p.x,p.z);walk(g,m,T+n.x,n.kid?10:6);
    if(n.marker===undefined){n.marker=add(new TH.PlaneGeometry(.7,.7),labelTex('#ffffff','#e0922f','#e0922f','📋'),0,2.35,0,n.g,0)}
    n.marker.visible=weeklyOrders.some(o=>o.status==='accepted'&&o.npc===n.n&&S.d<=o.deadline);
  });
}

function camSafe(dt=.016){
  if(busAnim)return;
  const hx=P.x,hy=P.y+1.4-.3*(pg.ws?pg.ws.c:0),hz=P.z;
  const indoor=inK||inCl||inLb||inHm;
  const maxD=indoor?5.4:camDist;
  const dx=Math.sin(cy)*Math.cos(cp),dy=Math.sin(cp),dz=Math.cos(cy)*Math.cos(cp);
  let safeD=maxD;
  if(indoor){
    const R=inK?KD:(inCl?CK:(inLb?LB:HM));
    const minX=R.x-R.w/2+.65,maxX=R.x+R.w/2-.65;
    const minZ=R.z-R.d/2+.65,maxZ=R.z+R.d/2-.65;
    const minY=.65,maxY=R.h-.55;
    for(let d=1.5;d<=maxD;d+=.2){
      const tx=hx+dx*d,ty=hy+dy*d,tz=hz+dz*d;
      if(tx<minX||tx>maxX||tz<minZ||tz>maxZ||ty<minY||ty>maxY){
        safeD=Math.max(1.4,d-.2);break;
      }
    }
    cam.position.set(
      Math.max(minX,Math.min(maxX,hx+dx*safeD)),
      Math.max(minY,Math.min(maxY,hy+dy*safeD)),
      Math.max(minZ,Math.min(maxZ,hz+dz*safeD))
    );
  }else if(inCity){
    for(let d=1.6;d<=maxD;d+=.25){
      const tx=hx+dx*d,ty=hy+dy*d,tz=hz+dz*d;
      let hit=0;
      for(let i=0;i<cityCols.length;i++){
        const c=cityCols[i];
        if(Math.abs(tx-c.x)<c.w/2+.55&&Math.abs(tz-c.z)<c.d/2+.55&&ty<(c.h||12)+.4){hit=1;break}
      }
      if(hit){safeD=Math.max(1.5,d-.25);break}
    }
    cam.position.set(hx+dx*safeD,Math.max(hy+dy*safeD,.7),hz+dz*safeD);
  }else if(!inC){
    for(let d=1.6;d<=maxD;d+=.25){
      const tx=hx+dx*d,ty=hy+dy*d,tz=hz+dz*d;
      let hit=0;
      for(let i=0;i<col2.length;i++){
        const c=col2[i];
        if(c.w<1.2)continue;
        const ch=c.h||6;
        if(Math.abs(tx-c.x)<c.w/2+.55&&Math.abs(tz-c.z)<c.d/2+.55&&ty<ch+.4){hit=1;break}
      }
      if(hit){safeD=Math.max(1.5,d-.25);break}
    }
    const cx2=hx+dx*safeD,cz2=hz+dz*safeD;
    const cy2=Math.max(hy+dy*safeD,H(cx2,cz2)+.7);
    cam.position.set(cx2,cy2,cz2);
  }else{
    cam.position.set(hx+dx*maxD,Math.max(hy+dy*maxD,.7),hz+dz*maxD);
  }
  const ex=cam.position.x,ey=cam.position.y,ez=cam.position.z;
  if(P.distanceTo(lastP)>4)camSnap=1;lastP.copy(P);
  const lookY=P.y+1.3-.25*(pg.ws?pg.ws.c:0);
  if(camSnap){camS.set(ex,ey,ez);camL.set(P.x,lookY,P.z);camSnap=0}
  else{
    const dT=Math.hypot(ex-P.x,ey-P.y,ez-P.z),dS=Math.hypot(camS.x-P.x,camS.y-P.y,camS.z-P.z);
    const kc=1-Math.exp(-dt*(dT<dS-.05?(CUT?6:22):(CUT?3.5:12))),kl=1-Math.exp(-dt*(CUT?5:18));
    camS.x+=(ex-camS.x)*kc;camS.y+=(ey-camS.y)*kc;camS.z+=(ez-camS.z)*kc;
    camL.x+=(P.x-camL.x)*kl;camL.y+=(lookY-camL.y)*kl;camL.z+=(P.z-camL.z)*kl;
  }
  const tf=60+(inC?0:5)*(pg.ws?pg.ws.r:0);
  if(Math.abs(cam.fov-tf)>.02){cam.fov+=(tf-cam.fov)*Math.min(1,dt*5);cam.updateProjectionMatrix()}
  cam.position.copy(camS);cam.lookAt(camL);sky.position.copy(cam.position);
}
